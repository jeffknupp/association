    // prints a 127.0.0.1 URL, which IS one - but the same server answers on a
    // LAN address over plain http, where the API is simply undefined, so the
    // older selection-based copy stays as the fallback rather than the page
    // silently doing nothing.
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.top = "-1000px";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      area.remove();
      if (ok) resolve(); else reject(new Error("copy was refused"));
    });
  }

  function copyButton(text) {
    const button = el("button", "copy");
    button.type = "button";  // inside no form today, but it must never submit one
    button.innerHTML = COPY_ICON;
    button.title = "Copy this question";
    button.setAttribute("aria-label", "Copy this question");
    button.addEventListener("click", () => {
      writeToClipboard(text).then(
        () => mark(button, "done", "Copied"),
        () => mark(button, "failed", "Could not copy - select the text instead"),
      );
    });
    return button;
  }

  function mark(button, cls, label) {
    button.classList.remove("done", "failed");
    button.classList.add(cls);
    button.title = label;
    button.setAttribute("aria-label", label);
    window.setTimeout(() => {
      button.classList.remove(cls);
      button.title = "Copy this question";
      button.setAttribute("aria-label", "Copy this question");
    }, 1400);
  }

  function disclosure(summary, text, cls) {
    const details = el("details", cls ? null : "text");
    details.appendChild(el("summary", null, summary));
    details.appendChild(el("pre", cls || null, text));
    return details;
  }

  // ---- annotating an answer -------------------------------------------

  // Saved back into `historyFile` - the file `association web` already
  // writes for this exact answer (build, trace, timing, the answer text) -
  // rather than kept only on this page, which is lost on reload the same
  // way the rest of the conversation is (ISSUES.md #69). One box is one
  // note: saving again after an edit REPLACES the line the earlier save
  // wrote (the server returns that line; it goes back as `replaces`), so the
  // text stays in the box afterward and a correction does not leave its
  // first draft on record beside it.
  function noteControl(historyFile) {
    let savedLine = null;
    const box = el("div", "note-box");
    const ta = el("textarea", "note-input");
    ta.rows = 1;
    ta.placeholder = "Add a note about this answer…";
    const row = el("div", "note-row");
    const button = el("button", "note-save", "Save note");
    button.type = "button";  // never submits the question form it sits inside
    const status = el("span", "note-status");
    row.appendChild(button);
    row.appendChild(status);
    box.appendChild(ta);
    box.appendChild(row);

    function resize() {
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
    }
    ta.addEventListener("input", () => {
      resize();
      // Edited since the last save - the old "saved" state no longer
      // describes what is in the box.
      status.textContent = "";
      status.classList.remove("failed");
    });

    button.addEventListener("click", () => {
      const note = ta.value.trim();
      if (!note) {
        status.textContent = "Nothing to save";
        status.classList.add("failed");
        return;
      }
      button.disabled = true;
      status.classList.remove("failed");
      status.textContent = "Saving…";
      fetch("/api/notes", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ history_file: historyFile, note: note, replaces: savedLine }),
      }).then(r => {
        if (!r.ok) throw new Error("save failed");
        return r.json();
      }).then(saved => {
        savedLine = saved.line || null;
        status.classList.remove("failed");
        status.textContent = "Note saved";
      }).catch(() => {
        status.classList.add("failed");
        status.textContent = "Could not save the note";
      }).finally(() => { button.disabled = false; });
    });

    return box;
  }

  function ask() {
    const question = input.value.trim();
    if (!question || send.disabled) return;
    if (empty) empty.remove();
    // Recorded before the box is cleared. A repeat of the question just asked
    // is not a second entry, the way a shell drops a duplicate line.
    if (asked[asked.length - 1] !== question) asked.push(question);
    recallAt = null;
    draft = "";
    input.value = "";
    input.style.height = "auto";
    send.disabled = true;

    const turn = el("div", "turn");
    const row = el("div", "q-row");
    row.appendChild(copyButton(question));
    row.appendChild(el("div", "q", question));
    turn.appendChild(row);
    const answer = el("div", "a");
    // The trace is the answer until there is one. A fall-through to the agent
    // can take two minutes, and a spinner for that long is indistinguishable
    // from a hang - so show what it is actually doing.
    const trace = el("pre", "trace", "asking…");
    answer.appendChild(trace);
    turn.appendChild(answer);
    thread.appendChild(turn);
    scroll();

    const source = new EventSource("/api/ask/stream?question=" + encodeURIComponent(question));
    let lines = [];

    source.addEventListener("queued", () => {
      lines.push("waiting for the question ahead of this one…");
      trace.textContent = lines.join("\n");
      scroll();
    });

    source.addEventListener("progress", e => {
      lines.push(JSON.parse(e.data).line);
      trace.textContent = lines.join("\n");
      trace.scrollTop = trace.scrollHeight;
      scroll();
    });

    source.addEventListener("answer", e => {
      const a = JSON.parse(e.data);
      answer.innerHTML = "";
      // A rendered form when this intent has one, the text otherwise.
      const rendered = renderAnswer(a);
      answer.appendChild(rendered || prose(a));

      const meta = el("div", "meta");
      const badge = el("span", "badge " + a.answered_by, a.answered_by === "fast" ? "template" : "agent");
      // Which path answered is the most useful thing a reader can know about
      // an answer's reliability: a template built this sentence from code, or a
      // 7B model wrote SQL for it. Never hidden.
      badge.title = a.answered_by === "fast"
        ? "Answered deterministically by a template" + (a.intent ? " (" + a.intent + ")" : "")
        : "Answered by the tool-calling agent, which wrote the SQL itself";
      meta.appendChild(badge);
      if (a.intent) meta.appendChild(el("span", null, a.intent));
      meta.appendChild(el("span", null, a.timing.total_seconds.toFixed(2) + "s"));

      // The text is never lost when a table replaced it - it is the same
      // answer the CLI prints, one click away, beside the trace.
      if (rendered) meta.appendChild(disclosure("text", a.text));
      if (lines.length) meta.appendChild(disclosure("trace", lines.join("\n"), "trace"));
      answer.appendChild(meta);
      // `history_file` is missing only when nothing that looked like a
      // history file's own trace line ever went by - real traffic always
      // writes one, but there is nothing to attach a note to without it.
      if (a.history_file) answer.appendChild(noteControl(a.history_file));
      scroll();
    });

    source.addEventListener("error", e => {
      // Two different things arrive here: an `error` event the server sent,
      // which has a message, and EventSource's own connection error, which has
      // no data at all.
      if (e.data) {
        answer.innerHTML = "";
        answer.appendChild(el("pre", null, JSON.parse(e.data).message));
      }
      finish();
    });

    function finish() { source.close(); send.disabled = false; input.focus(); }
    // The server closes the stream when it is done; EventSource reports that
    // as an error with no data, which finish() above already handles.
    source.addEventListener("answer", finish);
  }
})();
</script>
</body>
</html>
