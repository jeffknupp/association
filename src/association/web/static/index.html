<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>association</title>
<style>
  /* Theme-aware the same way the chart pages are: every color is a variable,
     defined light and redefined under prefers-color-scheme, so the page follows
     the reader's system setting without a toggle to remember. */
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1d1d1b;
    --muted: #6b6b66;
    --line: #e2e2dd;
    --accent: #2b6fb0;
    /* The send button's ink is its own token: the dark accent is a light
       blue, and white on it is barely legible. */
    --on-accent: #ffffff;
    --user-bg: #2b6fb0;
    --user-ink: #ffffff;
    --fast: #2f7d4f;
    --agent: #b06a1f;
    /* Something the reader asked for did not happen. Distinct from --agent,
       which says which path answered and is not a fault. */
    --warn: #b3261e;
    --trace-bg: #f0f0ec;
    --edge: rgba(0, 0, 0, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1e1e24;
      --ink: #e8e8e4;
      --muted: #9a9a94;
      --line: #303038;
      --accent: #6cb2f0;
      --on-accent: #10161d;
      --user-bg: #2f5d86;
      --user-ink: #f2f8ff;
      --fast: #7fd07a;
      --agent: #f0a05c;
      --warn: #f2938c;
      --trace-bg: #17171c;
      --edge: rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 10px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .status { font-size: 12px; color: var(--muted); margin-left: auto; }
  /* The connection indicator: whether this page can still reach its server,
     and whether that server has restarted under it (a new commit or a rebuilt
     warehouse, on the deployed box). */
  header .conn { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  header .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  header .conn.ok .dot { background: var(--fast); }
  header .conn.stale .dot { background: var(--agent); }
  header .conn.down .dot { background: var(--warn); }
  header .conn.down { color: var(--warn); }
  header .conn.updated .dot { background: var(--accent); }
  header .conn.updated { color: var(--accent); cursor: pointer; text-decoration: underline; }
  /* #71: what the warehouse actually holds, in the tiers coverage.py
     enforces - box score, +play-by-play, +NetPoints - rather than the single
     min/max season the status line above gives, which reads as "the whole
     range is answerable" when only the narrowest table in it is. */
  .coverage {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 11.5px;
  }
  .coverage:empty { display: none; }
  .coverage-tier {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
    color: var(--muted);
    cursor: default;
  }
  .coverage-tier b { color: var(--ink); font-weight: 600; }
  /* A season inside the range but not fully covered - shown, not hidden,
     since half a season is a real answer and silence about which half would
     be the same false-cause mistake coverage.py exists to stop. */
  .coverage-tier.partial { border-color: var(--agent); color: var(--agent); }
  /* No data loaded for this tier at all - distinct from "partial": nothing
     here is wrong, it just was never pulled. */
  .coverage-tier.missing { opacity: .55; }
  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 820px; margin: 0 auto; padding: 24px 20px 8px; }
  .turn { margin-bottom: 22px; }
  .q {
    background: var(--user-bg);
    color: var(--user-ink);
    padding: 9px 14px;
    border-radius: 16px 16px 4px 16px;
    max-width: 78%;
    margin-left: auto;
    width: fit-content;
    white-space: pre-wrap;
  }
  /* The balloon and its copy button. The button sits OUTSIDE the balloon so
     the question's own text keeps `white-space: pre-wrap` over a plain text
     node - a question typed across two lines has to render as it was typed. */
  .q-row { display: flex; align-items: flex-start; justify-content: flex-end; gap: 6px; }
  .q-row .q { margin-left: 0; }
  .copy {
    flex: none;
    margin-top: 6px;
    padding: 4px;
    line-height: 0;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.12s, color 0.12s;
  }
  .copy:hover, .copy:focus-visible { opacity: 1; color: var(--ink); background: var(--panel); }
  .copy svg { width: 15px; height: 15px; display: block; }
  /* Said, not only shown: the icon alone cannot report that the copy failed,
     which on a page reached over http by IP is the likely case. */
  .copy.done { opacity: 1; color: var(--accent); }
  .copy.failed { opacity: 1; color: var(--warn); }
  .a {
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px 16px 16px 16px;
    padding: 12px 16px;
  }
  .a pre {
    margin: 0;
    font: 13px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .meta {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .badge { font-weight: 600; }
  .badge.fast { color: var(--fast); }
  .badge.agent { color: var(--agent); }
  .trace {
    margin: 0;
    background: var(--trace-bg);
    border-radius: 8px;
    padding: 10px 14px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color: var(--muted);
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
  }
  /* The answer's own sentence, first and at reading size: it IS the answer,
     the table under it is the evidence. It used to be the muted 12.5px
     caption, smaller than the table it headed (Jeff's note, 2026-09-24). */
  .headline {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .caption {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  /* What the sentence goes on to say after its table - a footnote's key
     ("* still going at the last game on record"), a coverage caveat, how a
     name was read. Shown, not hidden under the text toggle. */
  .notes { margin-top: 8px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  details.folded summary { font-size: 12.5px; color: var(--muted); cursor: pointer; margin: 4px 0 6px; }
  .notes p { margin: 0 0 4px; }
  /* Typeset, not terminal: the page's own proportional font rather than
     monospace, with tabular-nums so digits still line up in a numeric column
     without the wide fixed-pitch letterforms a name or opponent column never
     needed (Jeff's note, 2026-09-24). The CLI's own monospace text is still
     one click away, under the "text" disclosure. */
  table.answer {
    border-collapse: collapse;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    /* Sized to its content, not stretched across the answer: a five-column
       table spread over 800px is harder to read across than a narrow one. */
    width: auto;
  }
  table.answer th, table.answer td {
    padding: 5px 22px 5px 0;
    text-align: right;
    white-space: nowrap;
  }
  table.answer th.text, table.answer td.text { text-align: left; }
  table.answer th {
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    padding-bottom: 7px;
  }
  table.answer td.rank { color: var(--muted); }
  table.answer tbody tr:first-child td { padding-top: 8px; }
  table.answer tbody tr:not(:last-child) td { border-bottom: 1px solid var(--line); }
  /* Wide tables scroll inside the answer rather than widening the page. */
  /* A table wider than the answer scrolls sideways, and on a phone most do -
     so each edge that has more beyond it shows a shadow. Pure CSS: the two
     panel-colored covers scroll WITH the content ("local") and hide the
     shadows, which stay put ("scroll"), exactly when that edge is reached. */
  .scroller {
    overflow-x: auto;
    background:
      linear-gradient(to right, var(--panel) 30%, transparent) left center / 40px 100% no-repeat local,
      linear-gradient(to left, var(--panel) 30%, transparent) right center / 40px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, var(--edge), transparent) left center / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, var(--edge), transparent) right center / 12px 100% no-repeat scroll;
  }
  .record { display: flex; gap: 22px; align-items: baseline; }
  .record .wl { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .record .pct { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }
  .spark { display: block; margin: 2px 0 12px; overflow: visible; width: 100%; max-width: 680px; height: auto; }
  .spark path { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  .spark circle { fill: var(--accent); }
  .spark text { font: 10px ui-monospace, Menlo, monospace; fill: var(--muted); }
  /* A single record's numbers, side by side rather than in a one-row table -
     team_outlook, player_stat, shot_distance and team_stat's per-metric ranks
     all have this shape: a handful of named values with nothing to rank or
     compare them against. */
  .stats { display: flex; flex-wrap: wrap; gap: 16px 28px; }
  .stats .stat { display: flex; flex-direction: column; gap: 2px; }
  .stats .stat .v { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .stats .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  /* head_to_head's two-team score, the same idiom as .record but with a
     second side across a "vs". */
  .h2h { display: flex; align-items: center; gap: 18px; }
  .h2h .side { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .h2h .side .wins { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .h2h .side .team { font-size: 12px; color: var(--muted); }
  .h2h .vs { font-size: 11px; color: var(--muted); }
  /* A label between two stacked tables - player_splits' four kinds,
     player_matchup's summary above its game log. */
  .group-title { font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 4px; }
  .group-title:first-child { margin-top: 0; }
  details.text summary, details summary { cursor: pointer; }
  details.text pre {
    margin: 8px 0 0;
    font: 12px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre-wrap;
    color: var(--muted);
  }
  iframe.artifact {
    display: block;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    /* Capped rather than left to grow: a fingerprint is a radar plus a
       twenty-row table, and at full height it would push the rest of the
       conversation off the screen. Past the cap the frame scrolls, and the
       link beside it opens the standalone file. */
    max-height: 640px;
    background: var(--panel);
  }
  .artifact-frame { position: relative; }
  /* Only while there is more below: a capped frame otherwise clips its content
     dead flat, which reads as a rendering fault rather than as somewhere to
     scroll. Painted in the CHART's own background - read off the document
     inside, since a chart page sets its own, not this page's --panel - and
     transparent to clicks and wheel events so it never intercepts a scroll. */
  .artifact-frame.capped::after {
    content: "";
    position: absolute;
    left: 1px;
    right: 1px;
    bottom: 1px;
    height: 54px;
    border-radius: 0 0 7px 7px;
    background: linear-gradient(to bottom, transparent, var(--artifact-bg, var(--panel)));
    pointer-events: none;
  }
  .artifact-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .artifact-link:hover { color: var(--accent); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .empty p { margin: 0 0 14px; }
  .examples { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .examples button {
    font: inherit;
    font-size: 13px;
    color: var(--accent);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .examples button:hover { border-color: var(--accent); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 14px 20px 18px; }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    min-height: 44px;
    max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 11.5px; color: var(--muted); }
  /* A note about one answer, saved back into that answer's own history file -
     under the meta row, unobtrusive by default and never in the way of the
     answer itself. */
  .note-box { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .note-input {
    display: block;
    width: 100%;
    resize: none;
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    min-height: 30px;
    max-height: 160px;
  }
  .note-input:focus { outline: none; border-color: var(--accent); }
  .note-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .note-save {
    font: inherit;
    font-size: 12px;
    color: var(--accent);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 12px;
    cursor: pointer;
  }
  .note-save:hover { border-color: var(--accent); }
  .note-save:disabled { opacity: .5; cursor: default; }
  .note-status { font-size: 11.5px; color: var(--muted); }
  .note-status.failed { color: var(--warn); }
  /* Phones. The chrome - header, coverage pills, footer - took about 80% of
     a 667px-tall screen at the desktop sizes, leaving an answer a third of
     it, so it is tightened here: the pills become one row that scrolls
     sideways instead of three stacked lines, and padding shrinks. Measured
     with a stubbed page at 320, 375 and 412px. */
  body { height: 100dvh; }  /* not 100%: mobile Safari's toolbar would cover the footer */
  header, .coverage, footer {
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  footer { padding-bottom: max(18px, env(safe-area-inset-bottom)); }
  @media (max-width: 600px) {
    header {
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      gap: 10px;
    }
    header h1 { font-size: 14px; }
    header .status { font-size: 11px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .conn { font-size: 11px; }
    .coverage {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left));
    }
    .coverage::-webkit-scrollbar { display: none; }
    .coverage-tier { flex: none; }
    .thread { padding: 14px 10px 4px; }
    .turn { margin-bottom: 16px; }
    .q { max-width: 85%; }
    .a { padding: 10px 12px; }
    /* A column heading is often a player's full name, and nowrap made one
       name the width of the phone: the comparison's second player started
       off-screen. Headings wrap; the numbers under them still do not. */
    table.answer { font-size: 12px; }
    table.answer th { white-space: normal; vertical-align: bottom; }
    table.answer th, table.answer td { padding-right: 14px; }
    iframe.artifact { max-height: 520px; }
    footer {
      padding-top: 10px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
    }
    form { gap: 8px; }
    button.send { padding: 0 16px; }
  }
  /* Touch screens: iOS zooms the whole page into any field under 16px when it
     is tapped, and a keyboard-shortcut hint has no keyboard to describe. */
  @media (pointer: coarse) {
    textarea, .note-input { font-size: 16px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>association</h1>
  <span class="status" id="status">checking…</span>
  <span class="conn" id="conn" role="status" aria-live="polite"><span class="dot"></span><span id="conn-text">connecting…</span></span>
</header>
<div class="coverage" id="coverage"></div>

<main>
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <p>Ask about the local warehouse. Each question is answered on its own — there is no conversation memory.</p>
      <div class="examples">
        <button type="button">who leads the league in assists?</button>
        <button type="button">Klay Thompson's 3pt percentage over the past 4 seasons</button>
        <button type="button">what was the Lakers record last season?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" enterkeyhint="send" autofocus></textarea>
    <button class="send" id="send" type="submit">Ask</button>
  </form>
  <div class="hint">Enter to send, Shift+Enter for a new line. One question at a time — the model has a single cache slot.</div>
</footer>

<script>
(function () {
  const thread = document.getElementById("thread");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const status = document.getElementById("status");

  fetch("/api/health").then(r => r.json()).then(h => {
    const parts = [];
    if (h.seasons) parts.push(`${h.seasons.games.toLocaleString()} games, ${h.seasons.first}–${h.seasons.last}`);
    else parts.push("no games loaded");
    if (!h.ollama_ready) parts.push("ollama unreachable");
    status.textContent = parts.join(" · ");
    status.title = `${h.warehouse}\nrouter: ${h.models.router}\nagent: ${h.models.agent}`;
  }).catch(() => { status.textContent = "server unreachable"; });

  // Connection and live reload. /api/ping names the server's instance, drawn
  // fresh each time it starts - and the deployed server restarts on every
  // commit to master and every warehouse rebuild, so a changed instance means
  // this page may be out of date. It reloads itself only when that loses
  // nothing: no answer on screen, no draft, no question in flight. Otherwise
  // it says so, and a click reloads - a thread of answers is not something to
  // throw away behind the reader's back.
  const conn = document.getElementById("conn");
  const connText = document.getElementById("conn-text");
  const PING_EVERY_MS = 10000;
  const RETRY_EVERY_MS = 3000;
  let instance = null;
  let failures = 0;
  let updated = false;
  function setConn(state, text, title) {
    conn.className = "conn " + state;
    connText.textContent = text;
    conn.title = title;
  }
  function nothingToLose() {
    return !thread.querySelector(".turn") && !input.value.trim() && !send.disabled;
  }
  function ping() {
    fetch("/api/ping", {cache: "no-store"}).then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(p => {
      failures = 0;
      if (instance === null) instance = p.instance;
      else if (p.instance !== instance) updated = true;
      if (updated && nothingToLose()) { location.reload(); return; }
      if (updated) setConn("updated", "updated · reload", "The server restarted, possibly with a newer version. Click to reload this page - the answers on it will be cleared.");
      else setConn("ok", p.busy ? "connected · answering" : "connected", "Connected to the server" + (p.busy ? "; it is answering a question." : "."));
    }).catch(() => {
      failures += 1;
      // One missed poll is a restart in progress as often as an outage.
      if (failures < 3) setConn("stale", "reconnecting…", "The last check could not reach the server; retrying.");
      else setConn("down", "disconnected", "The server has not answered " + failures + " checks in a row; still retrying.");
    }).finally(() => { setTimeout(ping, failures ? RETRY_EVERY_MS : PING_EVERY_MS); });
  }
  conn.addEventListener("click", () => { if (updated) location.reload(); });
  ping();

  // #71: what's actually answerable, per tier - read straight off the
  // response, never recomputed here. A tier with no `last_season` was never
  // loaded at all; one whose range holds a partial season is marked rather
  // than shown as uniformly whole, which is the same distinction a template's
  // own refusal or caveat draws.
  const coverage = document.getElementById("coverage");
  fetch("/api/coverage").then(r => r.json()).then(c => {
    for (const tier of c.tiers || []) {
      const pill = el("span", "coverage-tier");
      const partialSeasons = [...new Set((tier.partial_seasons || []).map(p => p.season))];
      if (tier.first_season == null || tier.last_season == null) {
        pill.classList.add("missing");
        pill.appendChild(document.createTextNode(tier.name + ": not loaded"));
      } else {
        pill.appendChild(document.createTextNode(tier.name + ": "));
        pill.appendChild(el("b", null, `${tier.first_season}–${tier.last_season}`));
        if (partialSeasons.length) {
          pill.classList.add("partial");
          pill.appendChild(document.createTextNode(` (partial: ${partialSeasons.join(", ")})`));
        }
        // The tooltip is where a phantom season is marked too - 1993 is
        // already excluded from the range by `first_season`, so it has
        // nothing to attach a visible badge to, but the reason it is missing
        // is worth saying rather than leaving as silent as any other gap.
        const titleLines = (tier.partial_seasons || []).map(p => `${p.season} (${p.table}): ${p.note}`);
        if ((tier.phantom_seasons || []).length) {
          const phantom = tier.phantom_seasons.join(", ");
          titleLines.push(`${phantom} excluded: ESPN serves ${tier.phantom_seasons.length > 1 ? "those seasons" : "that season"} as a duplicate copy of another season's rows`);
        }
        if (titleLines.length) pill.title = titleLines.join("\n");
      }
      coverage.appendChild(pill);
    }
  }).catch(() => {});  // the status line above already reports a dead server

  document.querySelectorAll(".examples button").forEach(b => {
    b.addEventListener("click", () => { input.value = b.textContent; ask(); });
  });

  function resizeInput() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", () => {
    resizeInput();
    // Typing is composing a new question, so the next ArrowUp starts from the
    // newest again rather than from wherever a previous recall left off.
    // Measured in a browser: without this, someone who browsed back to the
    // oldest question, then cleared the box and typed something fresh, found
    // ArrowUp doing nothing at all - it was still parked at the oldest.
    // setInput() assigns `value` directly, which fires no "input" event, so a
    // recall does not reset its own cursor here.
    recallAt = null;
  });

  // ---- question history, as a terminal keeps it ---------------------------
  //
  // The questions asked on this page, oldest first, with a cursor into them.
  // `asked` is only appended to by ask(), so the examples buttons and a typed
  // question land in it the same way.
  //
  // In memory, and so lost on reload - the page keeps no history of answers
  // either (ISSUES.md #69), and putting only the questions in localStorage
  // would leave a reader with a recall list that no longer matches anything
  // on screen.
  const asked = [];
  // null means "editing a new question"; otherwise an index into `asked`.
  let recallAt = null;
  // What was typed before stepping back, restored on stepping past the newest
  // entry - the same thing a shell does with a half-written line.
  let draft = "";

  function setInput(text) {
    input.value = text;
    resizeInput();
    // Caret at the end, so the recalled question is ready to edit or send.
    input.setSelectionRange(text.length, text.length);
  }

  // ArrowUp is only history when the caret is on the FIRST line, and
  // ArrowDown only on the last: a question typed across two lines still moves
  // the caret between them, which is what the key does everywhere else.
  function caretOnFirstLine() {
    return input.selectionStart === input.selectionEnd && input.value.lastIndexOf("\n", input.selectionStart - 1) === -1;
  }
  function caretOnLastLine() {
    return input.selectionStart === input.selectionEnd && input.value.indexOf("\n", input.selectionStart) === -1;
  }

  // Returns whether it handled the key, so an unhandled one still moves the
  // caret rather than being swallowed.
  function recall(step) {
    if (!asked.length) return false;
    if (recallAt === null) {
      if (step > 0) return false;  // nothing newer than what is being typed
      draft = input.value;
      recallAt = asked.length - 1;
    } else if (recallAt + step < 0) {
      return true;  // already at the oldest; hold there rather than wrapping
    } else if (recallAt + step >= asked.length) {
      recallAt = null;
      setInput(draft);
      return true;
    } else {
      recallAt += step;
    }
    setInput(asked[recallAt]);
    return true;
  }

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); return; }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowUp" && caretOnFirstLine() && recall(-1)) { e.preventDefault(); return; }
    if (e.key === "ArrowDown" && caretOnLastLine() && recall(1)) e.preventDefault();
  });
  form.addEventListener("submit", e => { e.preventDefault(); ask(); });

  // ---- rendering an answer per intent -------------------------------------
  //
  // Answer.data is already structured - resolved names and numbers, no ids and
  // no schema - so an intent that is a list or a set of side-by-side numbers
  // can be a real table instead of fixed-width text. Everything else falls
  // back to the text, which is always in the payload and is what the CLI
  // prints. That fallback is the normal case, not a failure: an intent with no
  // renderer here still answers correctly.
  //
  // No renderer re-derives a sentence. The phrasing lives in the templates, in
  // Python, once. What each renderer chooses is a *caption*, and it takes it
  // either from a scope string the template already computed (leaderboard's
  // `question_shape`) or from the answer's own first line - never by
  // reassembling one from the numbers.

  // Cosmetic only. An unmapped key still renders, just with a longer label
  // derived from its name - never with a wrong number.
  const LABELS = {
    display_name: "player", gamesPlayed: "G", games: "G", avgPoints: "PTS", avgRebounds: "REB",
    avgAssists: "AST", points: "PTS", rebounds: "REB", assists: "AST", minutes: "MIN", fouls: "PF",
    // PLAYER_STAT_COLUMNS (query/templates/common.py) pairs every one of
    // these with a season total under the SAME abbreviation above
    // (avgPoints/points both "PTS") - fine on their own (player_compare's
    // table has no totals to collide with), but player_stat's statGrid
    // disambiguates a total that collides with one of these itself (see its
    // renderer below) rather than doing it here.
    avgSteals: "STL", avgBlocks: "BLK", avgTurnovers: "TOV", avgFouls: "PF", avgMinutes: "MIN",
    avgThreePointFieldGoalsMade: "3PM", avgFieldGoalsMade: "FGM", avgFreeThrowsMade: "FTM",
    threePointFieldGoalPct: "3PT%", threePointFieldGoalsMade: "3PM", threePointFieldGoalsAttempted: "3PA",
    fieldGoalPct: "FG%", fieldGoalsMade: "FGM", fieldGoalsAttempted: "FGA",
    freeThrowPct: "FT%", freeThrowsMade: "FTM", freeThrowsAttempted: "FTA",
    team_score: "for", opponent_score: "against", home_away: "", won: "",
    // conditions._PLAYER_LINE / _TEAM_LINE / _matchup_line's own keys, read by
    // player_splits, with_without, record_when and player_matchup.
    steals: "STL", blocks: "BLK", turnovers: "TOV", threes: "3PM", fg_pct: "FG%",
    opponent_points: "OPP", avg_margin: "Margin",
  };

  function label(key) {
    if (key in LABELS) return LABELS[key];
    return key.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/_/g, " ").toLowerCase();
  }

  function num(v) {
    if (v === null || v === undefined) return "";
    if (typeof v !== "number") return String(v);
    return Number.isInteger(v) ? v.toLocaleString() : v.toFixed(1);
  }

  // A rate stored as a fraction (true shooting 0.724) prints as a percent -
  // "0.724, 0.703, 0.687" rendered as "0.7, 0.7, 0.7", every row the same
  // (2026-09-24). Decided by the column's label, never by the value: a
  // margin of +0.4 is not 40%. "percentage"/"pct" catch a column whose label
  // spells the word out rather than abbreviating to "%" ("3-point
  // percentage", a leaderboard's own question_shape text) - without them,
  // "47.8%" printed as "0.5" (Jeff's finding, 2026-09-24).
  function rateOrNum(v, label) {
    if (typeof v === "number" && /%|percentage|\bpct\b/i.test(label || "") && Math.abs(v) <= 1) return (v * 100).toFixed(1) + "%";
    return num(v);
  }

  // conditions._PLAYER_LINE / _TEAM_LINE / _matchup_line compute `fg_pct` as
  // 100 * makes / attempts - already in 0-100 form, never the ≤1 fraction
  // `rateOrNum` scales, so it gets its own formatter rather than plain
  // `num()`, which printed "47.8" with no percent sign (Jeff's finding,
  // 2026-09-24). Read by player_splits, with_without and player_matchup.
  function pct100(v) {
    return v === null || v === undefined ? "" : Number(v).toFixed(1) + "%";
  }

  // A per-game average always keeps one decimal, even where it lands on a
  // whole number ("4.0" turnovers beside "2.2", not "4" - Jeff's finding,
  // 2026-09-24). Used where the KEY itself says "this is an average" -
  // PLAYER_STAT_COLUMNS' "avg"-prefixed columns, read by player_stat and
  // player_compare - rather than table()'s column-wide pass, which cannot
  // tell an average column from a count column on a transposed table (see
  // table()'s own comment on `pad`).
  function avgFixed(v) {
    return v === null || v === undefined ? "" : Number(v).toFixed(1);
  }

  function signed(v, decimals) {
    // NetPoints carry their sign as the whole reading: an unmarked "0.42"
    // beside "-1.10" loses which player helped their team. `decimals`
    // defaults to NetPoints' own 2; a margin/differential column is 1, the
    // precision the sentence itself states ("+0.4", conditions._margin).
    if (v === null || v === undefined) return "";
    return typeof v === "number" ? (v >= 0 ? "+" : "") + v.toFixed(decimals === undefined ? 2 : decimals) : String(v);
  }

  // A cell counts as numeric with an optional leading sign and a trailing
  // percent - the exact same pattern the alignment test below pins, plus "%"
  // stripped before the match rather than folded into one regex, so that
  // pinned literal keeps matching verbatim.
  const NUM_CELL = /^[+-]?[\d,]+(\.\d+)?$/;
  function isNumericCell(v) {
    return v === "" || v === null || v === undefined || NUM_CELL.test(String(v)) || NUM_CELL.test(String(v).replace(/%$/, ""));
  }

  function table(headers, rows, opts) {
    // Alignment is read off the data, not declared per call: a column whose
    // every value is a number lines up on the right so the digits do, and
    // anything else - a name, a date, an opponent - goes left. Getting this
    // from the values means a new renderer cannot forget to say.
    const numeric = headers.map((_, i) => rows.some(r => r[i] !== "" && r[i] !== null && r[i] !== undefined) && rows.every(r => isNumericCell(r[i])));
    // Column-wide decimal consistency: once any cell in a numeric column
    // carries a decimal point, every other numeric cell in it gets one too -
    // "20" beside "15.1" reads as a different precision, not a whole number,
    // and it was: `num()`'s integer/float split is per-cell, so a player
    // whose average landed on an exact whole number printed without the
    // decimal his neighbors had (Jeff's finding, 2026-09-24). A column where
    // nothing has a decimal (a games count, a rank) is untouched.
    //
    // `skipPaddingRows` (from the end) keeps a synthesized summary row - a
    // game log's trailing "per game" average, a composed table's "Total" -
    // from padding, or from being padded by, the literal per-game rows above
    // it: those are a genuinely different kind of number (one real game's
    // point total is never "13.0"), and column-wide consistency is only
    // right where every row in a column is the same kind of figure.
    //
    // `pad: false` turns the whole pass off, for the one shape where even
    // that is not true: player_compare's table is transposed (a ROW is one
    // stat, a COLUMN is one player), so a player's column mixes games played
    // with points per game and everything between - "64" games would gain a
    // false ".0" from sharing a column with "33.5" points (Jeff's finding,
    // 2026-09-24). That renderer forces its own per-row decimal instead
    // (`avgFixed`), which is the one place `label()` already tells "a
    // per-game figure" apart from "a count" without guessing from the value.
    const skip = (opts && opts.skipPaddingRows) || 0;
    const pad = !opts || opts.pad !== false;
    const padded = rows.map(r => r.slice());
    const padTarget = skip ? padded.slice(0, padded.length - skip) : padded;
    headers.forEach((_, i) => {
      if (!pad || !numeric[i] || !padTarget.some(r => /\.\d/.test(String(r[i])))) return;
      padTarget.forEach(r => {
        const s = r[i] === null || r[i] === undefined ? "" : String(r[i]);
        const whole = s && !/\.\d/.test(s) && s.match(/^([+-]?[\d,]+)(%?)$/);
        if (whole) r[i] = `${whole[1]}.0${whole[2]}`;
      });
    });
    const t = el("table", "answer");
    const thead = el("thead");
    const hr = el("tr");
    headers.forEach((h, i) => hr.appendChild(el("th", numeric[i] ? null : "text", h)));
    thead.appendChild(hr);
    t.appendChild(thead);
    const tb = el("tbody");
    for (const row of padded) {
      const tr = el("tr");
      row.forEach((cell, i) => {
        const rank = i === 0 && numeric[0] && headers[0] === "#";
        const td = el("td", [numeric[i] ? "" : "text", rank ? "rank" : ""].filter(Boolean).join(" ") || null);
        td.textContent = cell === null || cell === undefined ? "" : String(cell);
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    }
    t.appendChild(tb);
    const wrap = el("div", "scroller");
    wrap.appendChild(t);
    return wrap;
  }

  // A body worth folding: a long per-game table beneath a sparkline that
  // already says what it says. Opens in place; the count is the summary.
  function folded(summary, body) {
    const details = el("details", "folded");
    details.appendChild(el("summary", null, summary));
    details.appendChild(body);
    return details;
  }

  function firstLine(text) { return (text || "").split("\n")[0].replace(/:$/, ""); }

  // A list of rows keyed by `nameKey`, numbered, with `valueKey` and any extra
  // columns the row happens to carry.
  function ranked(rows, nameKey, valueKey, valueLabel, extras, opts) {
    // One row is not a ranking - the rank column and the ordering are the
    // entire point of this shape. Returning null falls back to the sentence,
    // which says the same thing better. "Who leads the league in assists?"
    // routes with limit 1 and lands here constantly - MOST questions that
    // land here with one row are that shape, so the decline stays the
    // default. `leaderboard` is the one exception (`allowSingle`): a
    // question that asks for exactly one leader ("who leads the league in
    // total netpoints", limit 1) still gets a "#1" table rather than losing
    // its structure to the CLI text's monospace fallback (Jeff's finding,
    // 2026-09-24).
    const allowSingle = opts && opts.allowSingle;
    if (rows.length < 1 || (rows.length < 2 && !allowSingle)) return null;
    const headers = ["#", label(nameKey), valueLabel].concat((extras || []).map(label));
    const body = (slice, offset) => slice.map((r, i) => [offset + i + 1, r[nameKey], rateOrNum(r[valueKey], valueLabel)].concat((extras || []).map(k => num(r[k]))));
    // A ranking of 50 shows the top RANKING_SHOWN and folds the rest under
    // their own count - a top-50 netpoints leaderboard used to list all 50
    // rows whether the question asked "top 5" or "top 50" (Jeff's finding,
    // 2026-09-24). The shown rows are never hidden; only the tail folds.
    if (rows.length <= RANKING_SHOWN) return table(headers, body(rows, 0));
    const wrap = el("div");
    wrap.appendChild(table(headers, body(rows.slice(0, RANKING_SHOWN), 0)));
    wrap.appendChild(folded(`${rows.length - RANKING_SHOWN} more`, table(headers, body(rows.slice(RANKING_SHOWN), RANKING_SHOWN))));
    return wrap;
  }

  // A player's game log: home or away as the sentence says it ("@ BOS" -
  // every row used to read "vs"), the result, the columns the template chose
  // (`columns`, when it names extra ones such as FGM/FGA), and the per-game
  // line beneath when the template averaged the games.
  // Mirrors games._LOG_COLUMNS / _LOG_PERCENTAGES (query/templates/games.py):
  // a log header -> the key the game/averages dict stores it under. Player
  // logs always carry MIN/PTS/REB/AST (_LOG_BASE) and may name extra columns
  // in `d.columns` when the question asked for one (FGM/FGA, 3P%, +/-, ...) -
  // read here rather than the fixed four this used to hard-code, which drew
  // an FGM/FGA-less table for a question specifically about field-goal
  // attempts (Jeff's finding, 2026-09-24).
  const GAME_LOG_COLUMNS = {
    MIN: "minutes", PTS: "points", REB: "rebounds", AST: "assists", STL: "steals", BLK: "blocks", TO: "turnovers", PF: "fouls",
    "+/-": "plusMinus", OREB: "offensiveRebounds", DREB: "defensiveRebounds", FGM: "fieldGoalsMade", FGA: "fieldGoalsAttempted",
    "3PM": "threePointFieldGoalsMade", "3PA": "threePointFieldGoalsAttempted", FTM: "freeThrowsMade", FTA: "freeThrowsAttempted",
    "FG%": "fieldGoalPct", "3P%": "threePointFieldGoalPct", "FT%": "freeThrowPct",
  };

  // A game log's own cell - a header's suffix says its shape (a percent, the
  // signed +/-), and `average` (the "per game" summary row) always keeps one
  // decimal even where a single game's own count never would ("20 points one
  // night" stays "20"; the average of several nights stays "20.0" beside a
  // neighbor's "15.1" rather than losing its decimal on a night that happened
  // to be exact).
  function gameLogCell(header, value, average) {
    if (value === null || value === undefined) return "";
    if (header === "+/-") return (value >= 0 ? "+" : "") + (average ? value.toFixed(1) : String(Math.trunc(value)));
    if (/%$/.test(header)) return Number(value).toFixed(1) + "%";
    return average ? Number(value).toFixed(1) : num(value);
  }

  function playerLog(d) {
    const headers = d.columns && d.columns.length ? d.columns : ["MIN", "PTS", "REB", "AST"];
    const cols = headers.map(h => GAME_LOG_COLUMNS[h] || h);
    const tableHeaders = ["date", "opponent", "W/L"].concat(headers);
    // A player's row carries `result` ("W"/"L", null for a game with no
    // recorded winner); a team's carries `won`.
    const rows = d.games.map(g => [g.date, (g.home_away === "away" ? "@ " : "vs ") + g.opponent, g.result || (g.won === true ? "W" : g.won === false ? "L" : "")]
      .concat(headers.map((h, i) => gameLogCell(h, g[cols[i]]))));
    const hasAverages = d.averages && typeof d.averages === "object";
    if (hasAverages) rows.push(["per game", "", ""].concat(headers.map((h, i) => (d.averages[cols[i]] === undefined ? "" : gameLogCell(h, d.averages[cols[i]], true)))));
    // The "per game" row is its own kind of number - see table()'s own
    // comment - so it neither pads nor gets padded by the literal per-game
    // rows above it (Jeff's finding, 2026-09-24: a whole-number "per game"
    // average turned every real game's own point total into "13.0").
    return table(tableHeaders, rows, { skipPaddingRows: hasAverages ? 1 : 0 });
  }

  function sparkline(points) {
    // Chronological, left to right, which is the reverse of how the templates
    // order seasons (most recent first) - a line running backwards in time
    // would read as the opposite trend.
    const values = points.map(p => p.value);
    const lo = Math.min(...values), hi = Math.max(...values);
    const w = 640, h = 56, pad = 6;
    const span = hi - lo || 1;
    const x = i => pad + (i * (w - 2 * pad)) / Math.max(points.length - 1, 1);
    const y = v => h - pad - ((v - lo) / span) * (h - 2 * pad);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "spark");
    svg.setAttribute("viewBox", `0 0 ${w} ${h + 14}`);
    svg.setAttribute("width", String(w));
    svg.setAttribute("height", String(h + 14));
    svg.setAttribute("preserveAspectRatio", "xMinYMid meet");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" "));
    svg.appendChild(path);
    points.forEach((p, i) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", x(i).toFixed(1));
      c.setAttribute("cy", y(p.value).toFixed(1));
      c.setAttribute("r", "2.2");
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = `${p.label}: ${num(p.value)}`;
      c.appendChild(title);
      svg.appendChild(c);
    });
    // Only the endpoints are labeled: a label per season collides at four or
    // more, and the table underneath carries every one of them anyway.
    [[0, "start"], [points.length - 1, "end"]].forEach(([i, anchor]) => {
      if (points.length < 2 && i > 0) return;
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", x(i).toFixed(1));
      t.setAttribute("y", String(h + 11));
      t.setAttribute("text-anchor", anchor === "start" ? "start" : "end");
      t.textContent = points[i].label;
      svg.appendChild(t);
    });
    return svg;
  }

  // A handful of named values with nothing to rank or compare them against -
  // team_outlook's BPI and chances, player_stat's and shot_distance's single
  // line, team_stat's per-metric value and rank. `items` is
  // [{value, label}, ...], already formatted - this only lays them out.
  function statGrid(items) {
    const grid = el("div", "stats");
    for (const item of items) {
      const tile = el("div", "stat");
      tile.appendChild(el("span", "v", item.value));
      tile.appendChild(el("span", "l", item.label));
      grid.appendChild(tile);
    }
    return grid;
  }

  // record_when's stat name as a plural word ("points", "field goals made")
  // for "32+ points" - conditions.THRESHOLD_STAT_COLUMNS' keys are already
  // ordinary English but for the camelCase ones (fieldGoalsMade) label()'s
  // spacing reads better than the raw column name.
  function statUnit(stat) {
    return /[A-Z]/.test(stat) ? label(stat) : stat;
  }

  // player_splits' own group keys ("home", "wins", a month number as a
  // string) to the word a reader expects - conditions._GROUP_LABELS, kept in
  // step here because the raw key is what the page reads off Answer.data.
  const GROUP_LABELS = { home: "Home", away: "Away", starter: "Starter", bench: "Bench", wins: "Wins", losses: "Losses" };
  const SPLIT_TITLES = { home_away: "Home / away", starter_bench: "Starter / bench", wins_losses: "Wins / losses", month: "By month" };

  function groupLabel(kind, group) {
    return kind === "month" ? group : GROUP_LABELS[group] || group;
  }

  // intent -> {needs, render}. `needs` is the Answer.data keys the renderer
  // reads; a Python test checks each one against what the template actually
  // produces, because a renamed key would silently drop the table and fall
  // back to text, which looks like nothing happened at all.
  // A line between two points is only ever a slope, not a trend - drawn from
  // three, a sparkline says something a reader could not already read off two
  // numbers. A body over this many rows folds under its own count rather than
  // listing every one (team_quarter_points' original threshold, now shared).
  const MIN_SPARKLINE_POINTS = 2;
  const FOLD_GAMES_OVER = 12;

  // Points for a sparkline, keeping only ones with a real finite number - a
  // key mismatch between the data and what a renderer reads it under (see
  // ISSUES.md - "Template data the page cannot render from",
  // player_history/twoPointFieldGoalPct) produces `undefined` for every
  // point, and a line drawn through NaN coordinates is not a chart, just a
  // row of misplaced dots. Below MIN_SPARKLINE_POINTS valid points, no
  // sparkline is better than a broken one.
  function sparkPoints(items, toPoint) {
    const points = items.map(toPoint).filter(p => typeof p.value === "number" && Number.isFinite(p.value));
    return points.length > MIN_SPARKLINE_POINTS ? points : null;
  }
  // ranked()'s own fold point: how many rows of a leaderboard-shaped table
  // stay visible before the rest collapse under their own count.
  const RANKING_SHOWN = 10;

  // Mirrors templates.NETPOINTS_COMPARE_ROWS - label, then the data key.
  const NETPOINTS_ROWS = [
    ["net pts/100", "overall_per_100_poss"],
    ["\u00a0\u00a0offense", "offense_per_100_poss"],
    ["\u00a0\u00a0defense", "defense_per_100_poss"],
  ];

  const RENDERERS = {
    leaderboard: {
      needs: ["leaders", "question_shape"],
      render: (d, text) => {
        // Unlike a leaderboard in general, a single-leader question ("who
        // leads the league in assists?", the router's own limit 1) still
        // asks for a ranking - it is just a ranking of one - so it keeps its
        // "#1" table instead of falling to the CLI text's monospace block
        // (Jeff's finding, 2026-09-24).
        const body = ranked(d.leaders, "display_name", "value", firstValueLabel(d, text), d.fields || [], { allowSingle: true });
        return body && { caption: d.question_shape, body };
      },
    },
    threshold_count: {
      needs: ["leaders", "question_shape"],
      render: d => {
        const body = ranked(d.leaders, "player", "games", "G");
        return body && { caption: d.question_shape, body };
      },
    },
    single_game_high: {
      needs: ["games", "stat", "question_shape"],
      render: d => d.games.length < 2 ? null : ({
        caption: d.question_shape,
        body: table(["#", "player", label(d.stat), "date", "opponent"],
          d.games.map((g, i) => [i + 1, g.player, num(g.value), g.date, g.opponent])),
      }),
    },
    player_history: {
      needs: ["seasons", "stat", "player"],
      render: (d, text) => {
        const rows = d.seasons.slice().reverse();
        const cols = Object.keys(d.seasons[0] || {}).filter(k => k !== "season");
        const seasons = table(["season"].concat(cols.map(label)),
          d.seasons.map(s => [s.season].concat(cols.map(c => num(s[c])))));
        return {
          caption: firstLine(text),
          spark: sparkPoints(rows, s => ({ label: String(s.season), value: s[d.stat] })),
          // A "career" or "past 20 years" question is still a long list once
          // the sparkline has already said what it says - the same fold
          // team_quarter_points and period_split use for a long game log.
          body: d.seasons.length > FOLD_GAMES_OVER ? folded(`${d.seasons.length} seasons`, seasons) : seasons,
        };
      },
    },
    player_compare: {
      needs: ["players"],
      render: (d, text) => {
        const names = Object.keys(d.players);
        const stats = [...new Set(names.flatMap(n => Object.keys(d.players[n])))];
        // Deliberately not bolding a "winner" per row. More is not better for
        // turnovers or fouls, and a table that quietly asserted otherwise would
        // be exactly the confident-and-wrong answer this project guards against.
        // Every stat here but `gamesPlayed` is a per-game average
        // (PLAYER_STAT_COLUMNS' "avg" columns) - `avgFixed` rather than
        // `num()` keeps a whole-number average ("4.0" turnovers) from losing
        // its decimal beside a neighbor's "2.2" (Jeff's finding, 2026-09-24).
        const rows = stats.map(s => [label(s)].concat(names.map(n => (s.startsWith("avg") ? avgFixed(d.players[n][s]) : num(d.players[n][s])))));
        // The NetPoints summary, per 100 possessions, under the box-score line.
        // Read off `netpoints` but NOT listed in `needs`: NetPoints starts in
        // 2019 and is a separate opt-in fetch, so a comparison without it is
        // complete rather than broken, and requiring the key would drop the
        // whole table back to text for every earlier season.
        const net = d.netpoints || {};
        if (names.some(n => net[n] && Object.keys(net[n]).length)) {
          for (const [rowLabel, column] of NETPOINTS_ROWS) {
            rows.push([rowLabel].concat(names.map(n => signed((net[n] || {})[column]))));
          }
        }
        // This table is transposed (a row is one stat, a column is one
        // player), so table()'s own column-wide decimal pass would mix a
        // count (games) with an average (points) in the same player's
        // column - turned off here; every cell already carries the decimal
        // its own row calls for.
        return { caption: firstLine(text), body: table([""].concat(names), rows, { pad: false }) };
      },
    },
    game_log: {
      needs: ["games"],
      render: (d, text) => {
        if (!d.games.length) return null;
        const team = d.games[0].team_score !== undefined;
        // A game with no recorded winner is neither W nor L - 134 since 1994 -
        // and the template sends `won: null` for one rather than guessing.
        const body = team
          ? table(["date", "", "opponent", "for", "against"],
              d.games.map(g => [g.date, g.won === true ? "W" : g.won === false ? "L" : "\u2013", (g.home_away === "away" ? "at " : "vs ") + g.opponent, num(g.team_score), num(g.opponent_score)]))
          : playerLog(d);
        return { caption: firstLine(text), body };
      },
    },
    team_record: {
      needs: ["team"],
      render: (d, text) => {
        // Two shapes: one record (wins/losses/win_pct), or a month-by-month
        // split (`months`, one row per month - per season when a range was
        // asked for), which used to fall back to the terminal table.
        if (Array.isArray(d.months)) {
          if (!d.months.length) return null;
          const bySeason = "season" in d.months[0];
          const headers = (bySeason ? ["season"] : []).concat(["month", "G", "W-L"]);
          const rows = d.months.map(m => (bySeason ? [m.season] : []).concat([m.month || m.name, num(m.games), num(m.wins) + "-" + num(m.losses)]));
          return { caption: null, body: table(headers, rows) };
        }
        if (d.wins === undefined || d.losses === undefined || typeof d.win_pct !== "number") return null;
        const card = el("div", "record");
        card.appendChild(el("span", "wl", `${num(d.wins)}\u2013${num(d.losses)}`));
        card.appendChild(el("span", "pct", d.win_pct.toFixed(3).replace(/^0/, "")));
        // The sentence carries the seed, streak, home/road split and points
        // for/against, which are not in `data` - it used to sit whole as the
        // caption underneath so nothing was lost, but that duplicated the
        // headline AND the card almost word for word (both already say
        // "50-32 (.610)"). See ISSUES.md - "Template data the page cannot
        // render from" (team_record) - for making these fields (or a
        // `notes` list) reach the page properly; until then they are still
        // one click away under "text".
        return { caption: null, body: card };
      },
    },
    player_stat: {
      needs: ["player", "stats"],
      render: (d, text) => {
        const entries = Object.entries(d.stats);
        // {} on the refusal path ("no numbers in the warehouse") - a stat
        // grid with nothing on it would be a worse rendering of the same
        // refusal the sentence already states.
        if (!entries.length) return null;
        // PLAYER_STAT_COLUMNS (query/templates/common.py) reports a per-game
        // average and its season total side by side under the SAME label
        // ("PTS" for both avgPoints and points) - shown plain that read as
        // two tiles both saying "PTS" (Jeff's finding, 2026-09-24: "26.9 PTS"
        // beside "1,021 PTS"). Grouped per-game first (the more commonly
        // asked-for figure, and what a reader sees first), and a total whose
        // label collides with one already shown is marked so, from the keys
        // themselves rather than a hard-coded avgX/X pairing.
        const games = entries.filter(([k]) => k === "gamesPlayed");
        const perGame = entries.filter(([k]) => k !== "gamesPlayed" && k.startsWith("avg"));
        const totals = entries.filter(([k]) => k !== "gamesPlayed" && !k.startsWith("avg"));
        const perGameLabels = new Set(perGame.map(([k]) => label(k)));
        const items = [...games, ...perGame, ...totals].map(([k, v]) => {
          const lbl = label(k);
          const isTotal = totals.some(([tk]) => tk === k) && perGameLabels.has(lbl);
          const value = k.startsWith("avg") ? avgFixed(v) : rateOrNum(v, lbl);
          return { value, label: isTotal ? `${lbl} total` : lbl };
        });
        return { caption: firstLine(text), body: statGrid(items) };
      },
    },
    shot_distance: {
      needs: ["avg_feet", "attempts"],
      render: (d, text) => ({
        caption: firstLine(text),
        body: statGrid([
          { value: d.avg_feet.toFixed(1) + " ft", label: "avg distance" },
          { value: num(d.attempts), label: "attempts" },
        ]),
      }),
    },
    head_to_head: {
      needs: ["teams", "games", "wins"],
      render: (d, text) => {
        // Zero meetings is a real answer, but a 0-0 card says nothing the
        // sentence does not say better.
        if (!d.games) return null;
        const [a, b] = d.teams;
        const side = name => {
          const s = el("div", "side");
          s.appendChild(el("span", "wins", num(d.wins[name] || 0)));
          s.appendChild(el("span", "team", name));
          return s;
        };
        const card = el("div", "h2h");
        card.appendChild(side(a));
        card.appendChild(el("span", "vs", `${d.games} game${d.games === 1 ? "" : "s"}`));
        card.appendChild(side(b));
        return { caption: firstLine(text), body: card };
      },
    },
    team_quarter_points: {
      needs: ["games", "total"],
      render: (d, text) => {
        if (!d.games.length) return null;
        // A season's 82 rows are not the answer to "2nd half scoring this
        // season" - the total and the trend are; the games fold away beneath.
        const games = table(["date", "opponent", "PTS"], d.games.map(g => [g.date, g.opponent, num(g.points)]));
        return {
          caption: null,
          spark: sparkPoints(d.games, g => ({ label: g.date, value: g.points })),
          body: d.games.length > FOLD_GAMES_OVER ? folded(`${d.games.length} games`, games) : games,
        };
      },
    },
    period_leaderboard: {
      needs: ["leaders", "period"],
      render: (d, text) => {
        const body = ranked(d.leaders, "player", "average", "PTS/G", ["games"]);
        return body && { caption: null, body };
      },
    },
    period_split: {
      needs: ["games", "total", "average"],
      render: (d, text) => {
        if (!d.games.length) return null;
        // A season's worth of per-game rows is not the answer to "1st
        // quarter scoring this season" any more than team_quarter_points'
        // is - the total and the trend are - so it folds the same way
        // (Jeff's finding, 2026-09-24: a 76-row table shown in full).
        const games = table(["date", "opponent", "PTS"], d.games.map(g => [g.date, (g.home_away === "home" ? "vs " : "at ") + g.opponent, num(g.points)]));
        return {
          caption: firstLine(text),
          spark: sparkPoints(d.games, g => ({ label: g.date, value: g.points })),
          body: d.games.length > FOLD_GAMES_OVER ? folded(`${d.games.length} games`, games) : games,
        };
      },
    },
    player_splits: {
      needs: ["splits"],
      render: (d, text) => {
        const kinds = Object.keys(d.splits);
        if (!kinds.length) return null;
        // Every kind's rows carry the same stat keys (conditions._PLAYER_LINE
        // or _TEAM_LINE) - read off the first kind's first row rather than
        // hard-coding either line here.
        const statKeys = Object.keys(d.splits[kinds[0]][0] || {}).filter(k => !["group", "games", "wins", "losses"].includes(k));
        const box = el("div");
        for (const kind of kinds) {
          if (kinds.length > 1) box.appendChild(el("div", "group-title", SPLIT_TITLES[kind] || kind));
          box.appendChild(
            table(
              ["", "G", "W-L", ...statKeys.map(label)],
              d.splits[kind].map(g => [groupLabel(kind, g.group), num(g.games), `${g.wins}-${g.losses}`, ...statKeys.map(k => (k === "fg_pct" ? pct100(g[k]) : num(g[k])))]),
            ),
          );
        }
        return { caption: firstLine(text), body: box };
      },
    },
    with_without: {
      needs: ["groups"],
      render: (d, text) => {
        // Every refusal path (never on the same roster, time outside scope,
        // ...) still carries "groups": [] - an empty table would repeat that
        // refusal with nothing in it.
        if (!d.groups.length) return null;
        // The player columns are always in `groups` (conditions._with_without_group
        // computes them whether or not a subject was named), but they read as
        // zeroed noise when nobody was: gate on the same key the answer does.
        const showPlayer = !!d.player;
        const headers = ["", "G", "W-L", "Win%", "Margin"].concat(showPlayer ? ["MIN", "PTS", "REB", "AST", "FG%"] : []);
        const rows = d.groups.map(g => {
          const winPct = g.games ? g.wins / g.games : null;
          const row = [`${g.team} – ${g.teammate_played ? "with" : "without"} ${d.teammate}`, num(g.games), `${g.wins}-${g.losses}`, winPct == null ? "-" : winPct.toFixed(3).replace(/^0/, ""), signed(g.avg_margin, 1)];
          return showPlayer ? row.concat([num(g.minutes), num(g.points), num(g.rebounds), num(g.assists), pct100(g.fg_pct)]) : row;
        });
        return { caption: firstLine(text), body: table(headers, rows) };
      },
    },
    record_when: {
      needs: ["reached", "fell_short"],
      render: (d, text) => {
        const unit = statUnit(d.stat || "");
        const row = (name, g) => {
          const winPct = g.games ? g.wins / g.games : null;
          return [name, num(g.games), `${g.wins}-${g.losses}`, winPct == null ? "-" : winPct.toFixed(3).replace(/^0/, ""), signed(g.avg_margin, 1)];
        };
        return {
          caption: firstLine(text),
          body: table(["", "G", "W-L", "Win%", "Margin"], [row(`${d.threshold}+ ${unit}`, d.reached), row(`under ${d.threshold} ${unit}`, d.fell_short)]),
        };
      },
    },
    player_matchup: {
      needs: ["averages", "games"],
      render: (d, text) => {
        // No meetings carries no "averages" key at all (see _player_matchup_no_meetings),
        // so `needs` already falls back to text for that case; this guards
        // only the shape, not a refusal.
        if (!d.games.length) return null;
        const [a, b] = Object.keys(d.averages);
        // Every row but "games" is a per-game average (conditions._matchup_line) -
        // `avgFixed` keeps a whole-number one ("4.0" games played is a count
        // and stays "4", but a whole-number points-per-game average does not
        // lose its decimal). This table is transposed like player_compare's
        // (a row is one stat, a column is one player), so table()'s own
        // column-wide pass is off for the same reason - it cannot tell "games"
        // from "points" once they share a column.
        const matchupCell = (k, n) => (k === "games" ? num(d.averages[n][k]) : k === "fg_pct" ? pct100(d.averages[n][k]) : avgFixed(d.averages[n][k]));
        const summary = table(
          ["", a, b],
          ["games", "minutes", "points", "rebounds", "assists", "fg_pct"].map(k => [label(k), ...[a, b].map(n => matchupCell(k, n))]),
          { pad: false },
        );
        const line = s => `${num(s.points)}/${num(s.rebounds)}/${num(s.assists)}`;
        const log = table(
          ["date", "result", a, b],
          d.games.map(g => [g.date, g.won === true ? "W" : g.won === false ? "L" : "–", line(g[a]), line(g[b])]),
        );
        const box = el("div");
        box.appendChild(summary);
        box.appendChild(el("div", "group-title", "Most recent meetings (points/rebounds/assists)"));
        box.appendChild(log);
        return { caption: firstLine(text), body: box };
      },
    },
    streak: {
      needs: ["streaks"],
      render: (d, text) => {
        // "Never had one" is a real answer that carries "streaks": [].
        if (!d.streaks.length) return null;
        // The league-wide shape (one row per player or team-season) carries a
        // "name" the single-subject shape does not - templates.splits._streak_league
        // vs _single_streak.
        const league = "name" in d.streaks[0];
        const row = (s, i) => {
          const length = num(s.length) + (s.open ? " *" : "");
          return league ? [i + 1, s.name, length, s.from, s.to] : [length, s.from, s.to];
        };
        const headers = league ? ["#", "name", "games", "from", "to"] : ["games", "from", "to"];
        return { caption: firstLine(text), body: table(headers, d.streaks.map(row)) };
      },
    },
    team_stat: {
      needs: ["stats"],
      render: (d, text) => {
        const entries = Object.entries(d.stats);
        // {} on the "no stats for this team" refusal.
        if (!entries.length) return null;
        // Whether a metric is a percentage is not itself on the data - team_metrics.TEAM_METRICS
        // marks it with `percent=True`, and every one of those labels
        // happens to say "percentage" (field goal percentage, 3-point
        // percentage, ...), which is a fact about that table, not a
        // guess: no non-percent label contains the word.
        const rows = entries.map(([lbl, e]) => {
          const percent = /percentage/i.test(lbl);
          const value = e.value == null ? "-" : percent ? e.value.toFixed(1) + "%" : num(e.value);
          return [lbl, value, e.rank == null ? "-" : `${e.rank} of ${e.of}`];
        });
        return { caption: firstLine(text), body: table(["stat", "value", "rank"], rows) };
      },
    },
    team_leaderboard: {
      needs: ["teams"],
      render: d => {
        if (d.teams.length < 2) return null;
        return { caption: d.question_shape, body: table(["#", "team", "value"], d.teams.map(t => [t.rank, t.team, t.display])) };
      },
    },
    team_outlook: {
      needs: ["team", "season", "snapshot", "position", "chances"],
      render: d => {
        // No BPI means no rank either: "1 of 30" among thirty empty ratings says nothing.
        const items = [{ value: d.bpi == null ? "–" : (d.bpi >= 0 ? "+" : "") + d.bpi.toFixed(1), label: d.bpi == null ? "BPI" : `BPI (${d.position} of ${d.teams_in_snapshot})` }];
        if (d.wins != null && d.losses != null) items.push({ value: `${num(d.wins)}–${num(d.losses)}`, label: "record" });
        if (d.projected_wins != null && d.projected_losses != null) items.push({ value: `${num(d.projected_wins)}–${num(d.projected_losses)}`, label: "projected" });
        // A postseason snapshot's second record is the finished regular season, not a projection.
        if (d.regular_season_wins != null && d.regular_season_losses != null) items.push({ value: `${num(d.regular_season_wins)}–${num(d.regular_season_losses)}`, label: "regular season" });
        for (const [chanceLabel, value] of Object.entries(d.chances)) {
          if (value != null) items.push({ value: value.toFixed(1) + "%", label: chanceLabel });
        }
        if (d.strength_of_schedule != null) items.push({ value: (d.strength_of_schedule * 100).toFixed(1) + "%", label: "strength of schedule" });
        return { caption: `${d.snapshot} snapshot, updated ${d.updated}`, body: statGrid(items) };
      },
    },
  };

  function firstValueLabel(d, text) {
    // leaderboard's own words for what it ranked by, e.g. "assists per game",
    // taken from the scope string the template already built rather than
    // reassembled from the slots.
    const shape = String(d.question_shape || "");
    return shape.split(",")[0] || firstLine(text);
  }

  // A chart is served by the API out of the same directory the CLI writes to,
  // and drawn in an iframe rather than inlined into this page. The renderers
  // in court.py and radar.py emit complete, theme-aware documents that are
  // correct today; pulling their SVG out to inline it here would be a real
  // refactor of two modules for a better-integrated look, and this is the
  // version that risks nothing. Revisit once the look is settled.
  function chartFrame(art) {
    const wrap = el("div");
    const box = el("div", "artifact-frame");
    const frame = el("iframe", "artifact");
    frame.src = "/api/artifacts/" + encodeURIComponent(art.name);
    frame.title = art.kind.replace(/_/g, " ");
    frame.loading = "lazy";
    // Same-origin so the height can be read below, but scripts are off: these
    // pages are pure HTML, SVG and CSS - they have never contained a script -
    // so nothing legitimate is lost and the directory being served is one a
    // person can drop files into.
    frame.setAttribute("sandbox", "allow-same-origin");
    frame.height = "460";
    frame.addEventListener("load", () => {
      try {
        fit(frame, box);
      } catch (err) {
        /* keep the default height - a chart at the wrong height still draws */
      }
      scroll();
    });
    box.appendChild(frame);
    wrap.appendChild(box);
    // "full" rather than "open": a fingerprint is taller than the cap above,
    // so the frame scrolls, and the useful thing to say is that there is more
    // of it - not merely that it can also be opened elsewhere.
    const link = el("a", "artifact-link", "open the full " + art.kind.replace(/_/g, " ") + " \u2197");
    link.href = frame.src;
    link.target = "_blank";
    link.rel = "noopener";
    wrap.appendChild(link);
    return wrap;
  }

  // Size the frame to the chart it loaded, and mark it when there is more of
  // the chart than fits.
  function fit(frame, box) {
    const doc = frame.contentDocument;
    if (!doc) return;
    frame.height = String(doc.documentElement.scrollHeight + 2);
    // The cap is a CSS rule; read it back rather than repeating the number
    // here, where it would quietly stop matching the stylesheet.
    const cap = parseFloat(getComputedStyle(frame).maxHeight);
    if (!Number.isFinite(cap)) return;
    const bg = getComputedStyle(doc.body).backgroundColor;
    if (bg) box.style.setProperty("--artifact-bg", bg);
    const scroller = doc.scrollingElement || doc.documentElement;
    const update = () => {
      const more = scroller.scrollHeight - scroller.clientHeight - scroller.scrollTop > 2;
      // Dropped at the end of the scroll: a fade that stayed would sit over
      // the last row of a fingerprint's table, which is real content.
      box.classList.toggle("capped", more);
    };
    doc.addEventListener("scroll", update, { passive: true });
    update();
  }

  // A chart-only answer's sentence carries its own file path inline
  // ("...to /tmp/.../fingerprint_x.html Covers ..." - see shot_chart and
  // fingerprint's `message`), which is not information for a reader once the
  // chart itself is on screen; dropped rather than shown as the headline.
  function stripArtifactPath(s) {
    return (s || "").replace(/\s*\bto\s+\S+\.(?:html?|svg|png)\b/i, "").replace(/\s{2,}/g, " ").trim();
  }

  // A caption that only restates the headline (leaderboard's `question_shape`
  // is sometimes a strict PREFIX of the sentence it captions, e.g. "Record,
  // seasons 2011-2019" under "Record, seasons 2011-2019 - best record first,
  // of 30 teams") says nothing new underneath it (Jeff's finding,
  // 2026-09-24).
  function isRedundantCaption(caption, headline) {
    return !caption || !headline || caption === headline || headline.startsWith(caption);
  }

  function renderAnswer(a) {
    // Charts and a rendered body are independent: an answer can have either,
    // both, or neither. Every way the body can decline - no renderer, a key the
    // template stopped producing, a shape not worth a table - still leaves the
    // charts, which are the part a sentence cannot substitute for.
    const charts = (a.artifacts || []).map(chartFrame);
    const out = renderBody(a);
    if (!out && !charts.length) return null;
    const box = el("div");
    // The sentence first, at reading size, whether or not anything else
    // rendered: a chart-only answer (fingerprint, shot_chart) used to show
    // NO headline at all here - just the iframe, with which players and which
    // season left in the collapsed text toggle (Jeff's finding, 2026-09-24:
    // "generate fingerprints for embiid vs jolic" rendered what looked like a
    // blank card, the substitution note nowhere on screen). `data.message` is
    // the same sentence a table-shaped answer's `text` is, minus a "Next:
    // ..." tail; either way the artifact path in it is not a fact.
    const source = (a.data && typeof a.data.message === "string") ? a.data.message : a.text;
    const headline = (a.data && a.data.headline) || stripArtifactPath(firstLine(source).replace(/\s+Next:.*$/, ""));
    if (headline) box.appendChild(el("div", "headline", headline));
    if (out) {
      if (out.caption && !isRedundantCaption(out.caption, headline)) box.appendChild(el("div", "caption", out.caption));
      if (out.spark) box.appendChild(sparkline(out.spark));
      box.appendChild(out.body);
    }
    // Notes fall back to parsing the sentence's own lines only when nothing
    // rendered a structured body from `data` - a body built from `data` and a
    // note re-derived from the SAME sentence say the same thing twice
    // (Jeff's finding, 2026-09-24: team_outlook's stat card, with every line
    // under it repeated below as a "note"). See ISSUES.md - "Template data
    // the page cannot render from" - for the templates this costs until
    // `data.notes` covers what the fallback used to catch.
    const notes = answerNotes(a, { fallback: !out });
    if (notes.length) {
      const list = el("div", "notes");
      for (const note of notes) list.appendChild(el("p", null, note));
      box.appendChild(list);
    }
    for (const chart of charts) box.appendChild(chart);
    return box;
  }

  // The lines of an answer that are prose rather than its table: what a
  // template says after the rows (the meaning of a "*", how many games have
  // no box score, how a bare surname was read). Preferred from
  // `data.notes`, which the templates and agent.py fill as they attach
  // them; otherwise read off the text - a table's line holds a run of
  // spaces between its columns or ends in ":", and a note does neither.
  // `fallback` (default true) gates the text-parsing path: a renderer that
  // already built its body from `data` should show only `data.notes`, never
  // a second guess re-derived from the same sentence `data` came from - see
  // renderAnswer's own comment on the one call that passes `false`.
  function answerNotes(a, { fallback = true } = {}) {
    if (a.data && Array.isArray(a.data.notes) && a.data.notes.length) return a.data.notes.map(String);
    if (!fallback) return [];
    const lines = (a.text || "").split("\n").slice(1).map(l => l.trim()).filter(Boolean);
    return lines.filter(l => !/\S {2,}\S/.test(l) && !/:$/.test(l) && !/^[-=]+$/.test(l));
  }

  // An answer with nothing to draw is still a sentence, not a terminal dump:
  // the first line at reading size and the rest as notes when no line of it
  // is a table's ("who leads the league in assists?" is one sentence, and it
  // rendered in monospace). Text with table-shaped lines - a fall-through's,
  // an agent's - keeps the monospace block so its columns line up.
  function prose(a) {
    const lines = (a.text || "").split("\n");
    const tabular = lines.slice(1).some(l => /\S {2,}\S/.test(l) || /^\s+\S/.test(l));
    if (a.answered_by !== "fast" || tabular) return el("pre", null, a.text);
    const box = el("div");
    box.appendChild(el("div", "headline", firstLine(a.text)));
    const notes = answerNotes(a);
    if (notes.length) {
      const list = el("div", "notes");
      for (const note of notes) list.appendChild(el("p", null, note));
      box.appendChild(list);
    }
    return box;
  }

  function renderBody(a) {
    if (!a.data) return null;
    // A composed answer carries the compiler's own shape - `skeleton`, `rows`,
    // `measures` - whatever intent the router filed, so it is drawn by the
    // skeleton, not the intent: one renderer for every point on a relation.
    if (a.data.skeleton && Array.isArray(a.data.rows)) {
      try { return renderComposed(a.data, a.text) || null; } catch (err) { return null; }
    }
    const spec = a.intent && RENDERERS[a.intent];
    if (!spec) return null;
    // A key the template stopped producing means this renderer is looking at a
    // shape that no longer exists. Fall back rather than render half a table.
    if (spec.needs.some(k => a.data[k] === undefined || a.data[k] === null)) return null;
    try {
      return spec.render(a.data, a.text) || null;
    } catch (err) {
      return null;  // never let a rendering bug swallow an answer that is fine
    }
  }

  // The compiler's three skeletons (association.query.compose): rows are
  // games (a log, or the top games by a measure), grouped rows are per
  // player or per season, a scalar is one line of figures.
  const MEASURE_LABELS = {points: "PTS", rebounds: "REB", assists: "AST", minutes: "MIN", steals: "STL", blocks: "BLK", turnovers: "TOV", fouls: "PF",
    fieldGoalsMade: "FGM", fieldGoalsAttempted: "FGA", threePointFieldGoalsMade: "3PM", threePointFieldGoalsAttempted: "3PA", freeThrowsMade: "FTM", freeThrowsAttempted: "FTA",
    plusMinus: "+/-", ts_pct: "TS%", efg_pct: "eFG%", fg_pct: "FG%", three_pct: "3P%", ft_pct: "FT%", usage_pct: "USG%", game_score: "game score", pra: "PRA"};
  const FRACTIONS = new Set(["ts_pct", "efg_pct", "usage_pct"]);
  function measureCell(v, m) {
    if (v === null || v === undefined) return "";
    if (typeof v === "number" && FRACTIONS.has(m)) return (v * 100).toFixed(1) + "%";
    if (typeof v === "number" && /_pct$/.test(m)) return v.toFixed(1) + "%";
    return num(v);
  }
  function renderComposed(d, text) {
    const measures = d.measures || [];
    const labels = measures.map(m => MEASURE_LABELS[m] || m);
    if (d.skeleton === "rows") {
      if (!d.rows.length) return null;
      const named = d.rows.some(r => r.player);
      const headers = ["date"].concat(named ? ["player"] : [], ["opp", "W/L"], labels);
      const rows = d.rows.map(r => [r.day].concat(named ? [r.player || ""] : [], [(r.home ? "vs " : "@ ") + (r.opponent || ""), r.won ? "W" : "L"], measures.map(m => measureCell(r[m], m))));
      return { caption: null, body: table(headers, rows) };
    }
    if (d.skeleton === "grouped") {
      if (!d.rows.length) return null;
      const wins = d.rows.some(r => "wins" in r);
      const headers = [d.group || "group", "G"].concat(wins ? ["W-L"] : [], labels);
      const rows = d.rows.map(r => [r.group, num(r.games)].concat(wins ? [num(r.wins) + "-" + num(r.losses)] : [], measures.map(m => measureCell(r[m], m))));
      if (d.total !== undefined && d.total !== null && d.rows.length > 1) rows.push(["Total", num(d.total)].concat(wins ? [""] : [], measures.map(() => "")));
      return { caption: null, body: table(headers, rows) };
    }
    if (d.skeleton === "scalar") {
      const r = d.rows[0] || {};
      const items = [];
      if (r.games !== undefined) items.push({ value: num(r.games), label: "games" });
      if ("wins" in r) items.push({ value: num(r.wins) + "-" + num(r.losses), label: "record" });
      for (const m of measures) if (r[m] !== undefined) items.push({ value: measureCell(r[m], m), label: labels[measures.indexOf(m)] });
      return items.length ? { caption: null, body: statGrid(items) } : null;
    }
    return null;
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function scroll() { document.querySelector("main").scrollTop = thread.scrollHeight; }

  // ---- copying a question back out ---------------------------------------

  const COPY_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="9" y="9" width="11" height="11" rx="2"></rect>' +
    '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';

  function writeToClipboard(text) {
    // navigator.clipboard exists only in a secure context. `association web`
