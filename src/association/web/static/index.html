<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>association</title>
<style>
  /* Theme-aware the same way the chart pages are: every color is a variable,
     defined light and redefined under prefers-color-scheme, so the page follows
     the reader's system setting without a toggle to remember. */
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1d1d1b;
    --muted: #6b6b66;
    --line: #e2e2dd;
    --accent: #2b6fb0;
    /* The send button's ink is its own token: the dark accent is a light
       blue, and white on it is barely legible. */
    --on-accent: #ffffff;
    --user-bg: #2b6fb0;
    --user-ink: #ffffff;
    --fast: #2f7d4f;
    --agent: #b06a1f;
    --trace-bg: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1e1e24;
      --ink: #e8e8e4;
      --muted: #9a9a94;
      --line: #303038;
      --accent: #6cb2f0;
      --on-accent: #10161d;
      --user-bg: #2f5d86;
      --user-ink: #f2f8ff;
      --fast: #7fd07a;
      --agent: #f0a05c;
      --trace-bg: #17171c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 10px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .status { font-size: 12px; color: var(--muted); margin-left: auto; }
  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 820px; margin: 0 auto; padding: 24px 20px 8px; }
  .turn { margin-bottom: 22px; }
  .q {
    background: var(--user-bg);
    color: var(--user-ink);
    padding: 9px 14px;
    border-radius: 16px 16px 4px 16px;
    max-width: 78%;
    margin-left: auto;
    width: fit-content;
    white-space: pre-wrap;
  }
  .a {
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px 16px 16px 16px;
    padding: 12px 16px;
  }
  .a pre {
    margin: 0;
    font: 13px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .meta {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .badge { font-weight: 600; }
  .badge.fast { color: var(--fast); }
  .badge.agent { color: var(--agent); }
  .trace {
    margin: 0;
    background: var(--trace-bg);
    border-radius: 8px;
    padding: 10px 14px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color: var(--muted);
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .empty p { margin: 0 0 14px; }
  .examples { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .examples button {
    font: inherit;
    font-size: 13px;
    color: var(--accent);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .examples button:hover { border-color: var(--accent); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 14px 20px 18px; }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    min-height: 44px;
    max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>association</h1>
  <span class="status" id="status">checking…</span>
</header>

<main>
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <p>Ask about the local warehouse. Each question is answered on its own — there is no conversation memory.</p>
      <div class="examples">
        <button type="button">who leads the league in assists?</button>
        <button type="button">Klay Thompson's 3pt percentage over the past 4 seasons</button>
        <button type="button">what was the Lakers record last season?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" autofocus></textarea>
    <button class="send" id="send" type="submit">Ask</button>
  </form>
  <div class="hint">Enter to send, Shift+Enter for a new line. One question at a time — the model has a single cache slot.</div>
</footer>

<script>
(function () {
  const thread = document.getElementById("thread");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const status = document.getElementById("status");

  fetch("/api/health").then(r => r.json()).then(h => {
    const parts = [];
    if (h.seasons) parts.push(`${h.seasons.games.toLocaleString()} games, ${h.seasons.first}–${h.seasons.last}`);
    else parts.push("no games loaded");
    if (!h.ollama_ready) parts.push("ollama unreachable");
    status.textContent = parts.join(" · ");
    status.title = `${h.warehouse}\nrouter: ${h.models.router}\nagent: ${h.models.agent}`;
  }).catch(() => { status.textContent = "server unreachable"; });

  document.querySelectorAll(".examples button").forEach(b => {
    b.addEventListener("click", () => { input.value = b.textContent; ask(); });
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
  });
  form.addEventListener("submit", e => { e.preventDefault(); ask(); });

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function scroll() { document.querySelector("main").scrollTop = thread.scrollHeight; }

  function ask() {
    const question = input.value.trim();
    if (!question || send.disabled) return;
    if (empty) empty.remove();
    input.value = "";
    input.style.height = "auto";
    send.disabled = true;

    const turn = el("div", "turn");
    turn.appendChild(el("div", "q", question));
    const answer = el("div", "a");
    // The trace is the answer until there is one. A fall-through to the agent
    // can take two minutes, and a spinner for that long is indistinguishable
    // from a hang - so show what it is actually doing.
    const trace = el("pre", "trace", "asking…");
    answer.appendChild(trace);
    turn.appendChild(answer);
    thread.appendChild(turn);
    scroll();

    const source = new EventSource("/api/ask/stream?question=" + encodeURIComponent(question));
    let lines = [];

    source.addEventListener("queued", () => {
      lines.push("waiting for the question ahead of this one…");
      trace.textContent = lines.join("\n");
      scroll();
    });

    source.addEventListener("progress", e => {
      lines.push(JSON.parse(e.data).line);
      trace.textContent = lines.join("\n");
      trace.scrollTop = trace.scrollHeight;
      scroll();
    });

    source.addEventListener("answer", e => {
      const a = JSON.parse(e.data);
      answer.innerHTML = "";
      answer.appendChild(el("pre", null, a.text));

      const meta = el("div", "meta");
      const badge = el("span", "badge " + a.answered_by, a.answered_by === "fast" ? "template" : "agent");
      // Which path answered is the most useful thing a reader can know about
      // an answer's reliability: a template built this sentence from code, or a
      // 7B model wrote SQL for it. Never hidden.
      badge.title = a.answered_by === "fast"
        ? "Answered deterministically by a template" + (a.intent ? " (" + a.intent + ")" : "")
        : "Answered by the tool-calling agent, which wrote the SQL itself";
      meta.appendChild(badge);
      if (a.intent) meta.appendChild(el("span", null, a.intent));
      meta.appendChild(el("span", null, a.timing.total_seconds.toFixed(2) + "s"));
      for (const art of a.artifacts) meta.appendChild(el("span", null, art.name));
      if (lines.length) {
        const details = el("details");
        details.appendChild(el("summary", null, "trace"));
        details.appendChild(el("pre", "trace", lines.join("\n")));
        meta.appendChild(details);
      }
      answer.appendChild(meta);
      scroll();
    });

    source.addEventListener("error", e => {
      // Two different things arrive here: an `error` event the server sent,
      // which has a message, and EventSource's own connection error, which has
      // no data at all.
      if (e.data) {
        answer.innerHTML = "";
        answer.appendChild(el("pre", null, JSON.parse(e.data).message));
      }
      finish();
    });

    function finish() { source.close(); send.disabled = false; input.focus(); }
    // The server closes the stream when it is done; EventSource reports that
    // as an error with no data, which finish() above already handles.
    source.addEventListener("answer", finish);
  }
})();
</script>
</body>
</html>
