name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        # --frozen: build exactly what uv.lock pins, and fail if the lockfile
        # has drifted from pyproject.toml rather than silently resolving anew.
        run: uv sync --frozen --extra dev --extra docs --extra web

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Format (ruff)
        # The formatter inherits line-length = 200 from pyproject, so it joins
        # the long prompt/SQL strings up to that width instead of wrapping them
        # at 88 - which is what made adopting it viable here.
        run: uv run ruff format --check src tests scripts

      - name: Types (mypy, src)
        # src and tests are checked separately: combined, mypy resolves the
        # `association` package two ways and reports spurious errors. See the
        # note in .pre-commit-config.yaml.
        run: uv run mypy src

      - name: Types (mypy, tests)
        run: uv run mypy tests

      - name: Public API type completeness
        # pyright --verifytypes at 100%, the same gate pre-commit runs.
        run: scripts/check_types_complete.sh

      - name: Dead code (vulture)
        # Paths and confidence come from [tool.vulture]; framework-called names
        # are in vulture_whitelist.py, each with its caller.
        run: uv run vulture

      - name: Dependency declarations (deptry)
        # Every import in src, scripts and docs/conf.py is declared, and every
        # core dependency is imported. Settings in [tool.deptry].
        run: uv run deptry .

      - name: Spelling (codespell)
        # Every tracked file, as pre-commit passes them; [tool.codespell] skips
        # CHANGES.md and binaries and enforces American spelling.
        run: git ls-files -z | xargs -0 uv run codespell

      - name: Import contracts (import-linter)
        # Layers, fetch/query independence, no model client under web.app, and
        # no web-extra imports in the core. Contracts in [tool.importlinter].
        run: uv run lint-imports

      - name: Shell scripts (shellcheck)
        # Through pre-commit, so CI selects exactly the files the hook does
        # (anything with a shell shebang, not only *.sh). Checks: .shellcheckrc.
        run: uv run pre-commit run shellcheck --all-files

      - name: Complexity (xenon)
        # radon grades: no function worse than C, no module worse than C,
        # average no worse than B.
        run: uv run xenon --max-absolute C --max-modules C --max-average B src scripts

      - name: One concept, one definition
        # Cross-module constant collisions, against an allowlist of the ones
        # already filed - so this fails only on a NEW one. Ruff's F811 covers
        # the same shape inside a single module and is blind across two.
        run: scripts/check_duplicate_names.py

      - name: Docstring coverage
        run: scripts/check_docstrings.py

      - name: ISSUES.md priority headings
        # One heading per tier, in order: sync_issues.py labels by section,
        # and a deleted heading silently re-files every entry under it.
        run: scripts/check_issues_md.sh

      - name: Tests
        run: uv run pytest -q

      - name: Docs build
        # -W: a broken cross-reference or a module missing from the API tree
        # fails the build rather than rotting in the generated HTML.
        run: scripts/build_docs.sh

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html
          retention-days: 14
