[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "association"
version = "0.1.0"
description = "ESPN NBA stats: resumable fetch -> compact Parquet -> DuckDB warehouse -> local-LLM natural-language query"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "curl_cffi>=0.7",
    "duckdb>=1.0",
    "ollama>=0.6.2",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.scripts]
association = "association.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Generous on purpose: much of this codebase is prompt/schema description
# strings and SQL fixtures that read worse wrapped than left as one line.
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
