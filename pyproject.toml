[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "association"
version = "0.1.0"
description = "ESPN NBA stats: resumable fetch -> compact Parquet -> DuckDB warehouse -> local-LLM natural-language query"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "duckdb>=1.0",
    "ollama>=0.6.2",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.scripts]
association = "association.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
