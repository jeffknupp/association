[build-system]
# >=77 for PEP 639: the `license`-as-SPDX-string and `license-files` fields
# below are errors on older setuptools.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "association"
version = "1.3.0"
description = "ESPN NBA stats: resumable fetch -> compact Parquet -> DuckDB warehouse -> local-LLM natural-language query"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Knupp", email = "jeff@jeffknupp.com" }]
requires-python = ">=3.10"
keywords = ["nba", "basketball", "espn", "duckdb", "parquet", "ollama", "llm", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "curl_cffi>=0.7",
    "duckdb>=1.0",
    "ollama>=0.6.2",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/jeffknupp/association"
Documentation = "https://association.readthedocs.io/en/latest/"
Source = "https://github.com/jeffknupp/association"
Changelog = "https://github.com/jeffknupp/association/blob/master/CHANGES.md"
Issues = "https://github.com/jeffknupp/association/issues"

[project.scripts]
association = "association.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "ruff>=0.16.5",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1,<9",
    "sphinx-autodoc-typehints>=2.5",
    "sphinx-click>=6.0",
    "sphinx-copybutton>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ships the py.typed marker so consumers (and `pyright --verifytypes`)
# treat the package's annotations as authoritative rather than inferring them.
[tool.setuptools.package-data]
association = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Generous on purpose: much of this codebase is prompt/schema description
# strings and SQL fixtures that read worse wrapped than left as one line.
# The formatter reads this same setting, so `ruff format` joins those strings
# up to 200 columns rather than fighting them back down to 88.
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pyright]
# `src` explicitly: the editable install resolves through an import hook that
# pyright cannot follow, so --verifytypes reports "No py.typed file found"
# without this and scores 0% of zero symbols.
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
