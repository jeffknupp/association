[build-system]
# >=77 for PEP 639: the `license`-as-SPDX-string and `license-files` fields
# below are errors on older setuptools.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "association-py"
version = "4.4.0"
description = "ESPN NBA stats: resumable fetch -> compact Parquet -> DuckDB warehouse -> local-LLM natural-language query"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Knupp", email = "jeff@jeffknupp.com" }]
requires-python = ">=3.14"
keywords = ["nba", "basketball", "espn", "duckdb", "parquet", "ollama", "llm", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "click>=8.1",
    "curl_cffi>=0.7",
    "duckdb>=1.0",
    "ollama>=0.6.2",
    "pyarrow>=15.0",
    "rapidfuzz>=3.0",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/jeffknupp/association"
Documentation = "https://association.readthedocs.io/en/latest/"
Source = "https://github.com/jeffknupp/association"
Changelog = "https://github.com/jeffknupp/association/blob/master/CHANGES.md"
Issues = "https://github.com/jeffknupp/association/issues"

[project.scripts]
association = "association.cli:main"

[project.optional-dependencies]
dev = [
    "codespell[toml]>=2.4",
    "deptry>=0.23",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
    "shellcheck-py>=0.11",
    "vulture>=2.14",
    "xenon>=0.9",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "packaging>=24",
    "sphinx>=8.1,<9",
    "sphinx-autodoc-typehints>=2.5",
    "sphinx-click>=6.0",
    "sphinx-copybutton>=0.5",
]
web = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ships the py.typed marker so consumers (and `pyright --verifytypes`)
# treat the package's annotations as authoritative rather than inferring them.
[tool.setuptools.package-data]
association = ["py.typed"]
# The web UI is one self-contained HTML file. `association web` checks for it
# at startup rather than on the first request, because a wheel that dropped it
# would otherwise look like a working server that serves a 404.
"association.web" = ["static/*.html"]
# The ordinary-word list `query.subject` reads, with the notice its license
# requires. Shipped because reading the system's `/usr/share/dict/words`
# answered differently on a machine that lacks it.
"association.query" = ["words.txt.gz", "words.COPYRIGHT"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Generous on purpose: much of this codebase is prompt/schema description
# strings and SQL fixtures that read worse wrapped than left as one line.
# The formatter reads this same setting, so `ruff format` joins those strings
# up to 200 columns rather than fighting them back down to 88.
line-length = 200
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    "DTZ",   # naive datetimes: every stamp-to-date conversion here is load-bearing (see season.py)
    "BLE",   # blind excepts: each surviving one is a deliberate boundary, marked inline
    "RUF", "PERF", "C4", "SIM", "RET", "PLW", "PLE",
]
ignore = [
    # A long stopword list reads better as one string split on whitespace than
    # as a hundred quoted literals.
    "SIM905",
]

[tool.vulture]
# Tests and scripts count as callers, so a helper whose only caller is its own
# test is NOT reported - that shape needs a reader. 60 is vulture's lowest
# confidence: anything it merely suspects is reported, and the false positives
# (framework-registered callbacks, public API) are named in the whitelist.
paths = ["src", "tests", "scripts", "vulture_whitelist.py"]
min_confidence = 60

[tool.deptry]
# Everything that imports a package: the shipped code, the maintenance scripts
# and the Sphinx config. tests/ stays excluded (deptry's default), since it
# imports dev-only packages by design.
known_first_party = ["association"]
# Tools that are run rather than imported (pytest, mypy, sphinx, ...) are
# never reported as unused, and importing one from src would be reported.
optional_dependencies_dev_groups = ["dev", "docs"]

[tool.deptry.per_rule_ignores]
# docs/conf.py is the docs extra's own code: importing that extra is the point
# there, not a dev dependency leaking into the package.
DEP004 = ["packaging", "sphinx_autodoc_typehints"]
# scripts/check_web_ui.py drives the page in a real browser and is run as
# `uv run --with playwright python scripts/check_web_ui.py`, which supplies the
# package for that one command. Declaring it in the `dev` extra would be false:
# nothing needed to develop here or to run the gates imports it, and every
# `uv sync --extra dev` would pull a package (and, to be useful, a ~150MB
# browser) for a check that is deliberately not a gate. See that script's
# docstring for why it is not one.
DEP001 = ["playwright"]

[tool.codespell]
# en-GB_to_en-US enforces the American spelling AGENTS.md asks for; British
# forms have drifted back in twice after being removed.
builtin = "clear,rare,en-GB_to_en-US"
# CHANGES.md is a record: its released entries quote the spellings that were
# fixed. CLAUDE.md is a symlink to AGENTS.md, which is checked. Binary and
# generated files are never prose.
skip = "CHANGES.md,CLAUDE.md,uv.lock,*.png,*.jpg,*.svg,*.duckdb,*.parquet,completions/*"
# Basketball and ESPN tokens, not misspellings: OT (overtime), IST (the
# In-Season Tournament), PlayIn (ESPN's play-in season-type label). "alltime"
# is the yardstick-v2 F111 question's own spelling ("alperen şengün alltime
# record"), quoted verbatim across src/ and tests/ once it recurred past the
# single inline codespell:ignore in ISSUES.md.
ignore-words-list = "ot,ist,playin,alltime"

[tool.importlinter]
root_package = "association"
# Needed for the contracts below that name third-party packages.
include_external_packages = true
# An import under `if TYPE_CHECKING:` never runs, so it cannot load anything.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Package layers"
type = "layers"
# Higher layers may import lower ones, never the reverse. `|` marks siblings
# that must not import each other either. The bottom row, association.nba,
# imports nothing internal at all, which is what lets fetch and query share it.
layers = [
    "association.cli",
    "association.web",
    "association.query | association.check",
    "association.fetch",
    "association.nba",
]

[[tool.importlinter.contracts]]
name = "Fetching and querying stay independent"
# query reads the warehouse fetch builds, never fetch's code; fetch never
# needs to know how a question is asked. The layers above would allow
# query -> fetch, so this says it separately.
type = "independence"
modules = ["association.fetch", "association.query"]

[[tool.importlinter.contracts]]
name = "ollama stays out of the API layer"
# AGENTS.md, "Working on the web path": nothing in web/app.py may import a model
# client, which is what keeps the web tests offline by construction. Indirect
# imports count - a model client reached through another module is still loaded.
type = "forbidden"
source_modules = ["association.web.app"]
forbidden_modules = ["ollama"]
# The one sanctioned route: AgentRunner.ready imports ollama inside the method,
# at call time, so the health check can ask whether it is reachable. grimp
# cannot tell a call-time import from a module-level one, which is why
# tests/web/test_app.py also imports web.app in a fresh interpreter and checks
# ollama never loaded.
ignore_imports = ["association.web.runner -> ollama"]

[[tool.importlinter.contracts]]
name = "The core install never needs the web extra"
# fastapi, uvicorn and pydantic come from `association[web]`; cli reaches web
# only inside the `web` command, so it is not a source here either.
type = "forbidden"
source_modules = [
    "association.query",
    "association.fetch",
    "association.check",
    "association.nba",
]
forbidden_modules = ["fastapi", "uvicorn", "pydantic"]

# The three contracts below hold the query package to the stages ROADMAP.md
# is rebuilding it into (READ -> PLAN -> RUN -> SAY), while the packages
# those stages will live in do not exist yet. Each lists today's violations
# under ignore_imports, by name: a new one fails, and so does a listed one
# that is gone (import-linter reports an ignore that matches nothing), so
# the list only shrinks. scripts/check_ratchets.py holds the directions an
# import cannot express.

[[tool.importlinter.contracts]]
name = "The reader does not import the answer side"
# ROADMAP contract 1 and Phase 1: what is read must not depend on what will
# answer. Checked on CHAINS, not direct imports only, since 2026-10-03: until
# then router, subject and normalizer loaded the team-games relation through
# calendar -> conditions._MONTH_NAMES (the months are season_text's now), and
# the contract could not see it. It holds with no ignored edge since Phase 2,
# step 3 (2026-10-05): the last, point -> compose.adapt, went with the last
# adapter, whose default point the reader reads itself (point.DEFAULT_POINTS).
# The nine the contract was written with went one by one: the planner left
# the parser, the subject reading stopped asking which cells the answer
# honors, the team word's reader, five intent sets, the team metrics' words,
# the period columns, the metric aliases, the limits and Unsupported moved to
# the reader's side (entities, reading, measures), the point reader itself
# moved to query/point.py, and the adapters became default points.
type = "forbidden"
source_modules = [
    "association.query.normalizer",
    "association.query.parse",
    "association.query.point",
    "association.query.router",
    "association.query.subject",
    "association.query.season_text",
]
forbidden_modules = [
    "association.query.compose",
    "association.query.player_games",
    "association.query.player_relation",
    "association.query.team_games",
    "association.query.team_relation",
    "association.query.coverage",
    "association.query.conditions",
    "association.query.team_metrics",
    "association.query.season_line",
    "association.query.shotchart",
    "association.query.fingerprint",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "The compiler's sentence reads no warehouse"
# ROADMAP contract 3: a sayer takes a result and no connection. The two
# modules that write words from a result alone, held there: the compiler's
# own sentence, and the sayer Phase 2 builds slice by slice (compose.say,
# since 2026-10-03: the game log's words). Direct imports only: say still
# takes constants (column tables, phrase tables, labels) from modules that
# import duckdb for their readers - compose.logs, conditions, player_games,
# season_line - so a chain check fails on those four; it can be switched on
# once those constants live apart from the statements (measured 2026-10-05,
# Phase 2, step 6, when the templates and their phrase helpers had gone).
type = "forbidden"
source_modules = ["association.query.compose.sentence", "association.query.compose.say"]
forbidden_modules = ["duckdb"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The answer side never asks the model"
# ROADMAP contract 1: only the read stage reaches the normalizer (through
# the answering loop, which hands it the question).
type = "forbidden"
source_modules = [
    "association.query.compose",
    "association.query.player_games",
    "association.query.player_relation",
    "association.query.team_games",
    "association.query.team_relation",
    "association.query.coverage",
    "association.query.conditions",
    "association.query.entities",
    "association.query.refusals",
    "association.query.season_line",
    "association.query.stages",
]
forbidden_modules = ["association.query.normalizer", "ollama"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pyright]
# `src` explicitly: the editable install resolves through an import hook that
# pyright cannot follow, so --verifytypes reports "No py.typed file found"
# without this and scores 0% of zero symbols.
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
