repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      # After the linter, so an autofix can't leave the file unformatted.
      - id: ruff-format

  # Local hooks (not the isolated mirrors-mypy env) so mypy resolves the
  # `association` package and third-party stubs (pytest, duckdb, ...) exactly
  # as this project's own venv does - an isolated hook env would need every
  # dependency re-declared and re-installed separately, and would still get
  # `association` itself wrong (not pip-installed there).
  #
  # src and tests are checked in two SEPARATE invocations, not one `mypy src
  # tests` call: combined, mypy ends up resolving the `association` package
  # two different ways (the source-rooted src/ copy vs. the editable-installed
  # copy tests/ imports), which produces spurious cross-checking errors that
  # don't occur when each root is checked on its own (verified clean either way).
  - repo: local
    hooks:
      - id: changes-md
        name: CHANGES.md updated
        entry: scripts/check_changes_md.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy-src
        name: mypy (src)
        entry: .venv/bin/mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy-tests
        name: mypy (tests)
        entry: .venv/bin/mypy tests
        language: system
        pass_filenames: false
        types: [python]
      # Sphinx -W catches malformed docs but renders an undocumented function
      # perfectly happily, just uselessly - so coverage is checked separately
      # from the build.
      - id: verifytypes
        name: public API type completeness (pyright)
        entry: scripts/check_types_complete.sh
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject.toml)$
      # Dead code. Settings and the reasoning live in [tool.vulture]; names a
      # framework calls are listed, with their caller, in vulture_whitelist.py.
      - id: vulture
        name: dead code (vulture)
        entry: .venv/bin/vulture
        language: system
        pass_filenames: false
        types: [python]
      # Imports against declared dependencies. Settings in [tool.deptry].
      - id: deptry
        name: dependency declarations (deptry)
        entry: .venv/bin/deptry .
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|scripts/.*\.py|docs/conf\.py|pyproject\.toml)$
      # Typos, and British spellings (en-GB_to_en-US). Settings in
      # [tool.codespell]; pre-commit passes every tracked text file.
      - id: codespell
        name: spelling (codespell)
        entry: .venv/bin/codespell
        language: system
        types: [text]
      # Package layering and dependency rules. Contracts, each with its reason,
      # in [tool.importlinter].
      - id: import-linter
        name: import contracts (import-linter)
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$
      - id: duplicate-names
        name: one concept, one definition
        entry: scripts/check_duplicate_names.py
        language: system
        pass_filenames: false
        files: ^src/association/.*\.py$

      - id: docstrings
        name: docstring coverage (src)
        entry: scripts/check_docstrings.py
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
      - id: docs
        name: sphinx docs build
        entry: scripts/build_docs.sh
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|docs/.*|CHANGES.md|pyproject.toml|scripts/build_docs\.sh|scripts/check_docs_markup\.py)$
